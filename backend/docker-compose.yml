services:
  postgres:
    image: postgres:17-alpine
    container_name: nexttask-postgres
    environment:
      POSTGRES_USER: nexttask
      POSTGRES_PASSWORD: nexttask
      POSTGRES_DB: nexttask
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexttask -d nexttask"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
